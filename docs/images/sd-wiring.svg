<text x="550" y="514" font-size="12" fill="#111">DAT0 / DO (MISO) ※</text>
<text x="395.0" y="505" font-size="11" text-anchor="middle" fill="#8c564b">MISO</text>
<text x="550" y="334" font-size="11" fill="#556">DAT1・DAT2: 使わない ※</text>
<text x="20" y="576" font-size="12" fill="#333">※ プルアップ抵抗なしで動いている。RP2350 のエラッタ E9 の対策をするなら、</text>
<text x="20" y="596" font-size="12" fill="#333">　 DAT1・DAT2・CS・MISO を 10kΩ で 3V3 にプルアップする。</text>
<text x="20" y="616" font-size="12" fill="#333">別の GPIO につなぐ場合は EXTRA_CFLAGS="-DSD_MISO=20 -DSD_CS=21" のように指定してビルドする</text>
<text x="20" y="636" font-size="12" fill="#333">(定義は firmware/src/hw_config.c)。</text>
